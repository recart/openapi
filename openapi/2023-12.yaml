    PostEvent:
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - events
        attributes:
          type: object
          required:
            - phoneNumber
            - source
          properties:
            phoneNumber:
              type: string
              description: Preferably E.164 format
              example: '+36301234567'
            source:
              type: object
              required:
                - category
                - name
              properties:
                category:
                  type: string
                  description: Source category
                  example: payment
                name:
                  type: string
                  description: Source name
                  example: billing attempt failed
            properties:
              type: object
              description: |
                Data of the event, as flat key/value pairs. At most 10 properties are
                allowed; more than that is rejected with `400`.

                Properties are not automatically available to the flow. Only properties that
                Recart already supports are delivered to messages, where the message inserts
                one from the flow editor's variable picker. Contact Support to find out which
                properties your account can use, or to request support for a new one.

                Any other property is accepted and then discarded. The request still returns
                `200` and the flow is still triggered, but the value never reaches the
                message, so a discarded property is indistinguishable from a delivered one.
                Do not design a message around a property you have not confirmed is
                supported. To personalise or target on your own data, store it on the
                subscriber with `PATCH /subscribers` and use it as a segment condition
                instead.
              example:
                yourVariableName: 'your value'
