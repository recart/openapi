  '/subscribers/views/{name}':
    get:
      summary: Statistics view of the site's subscribers
      tags:
        - Subscriber
      operationId: getSubscribersView
      security:
        - ApiKeyAuth: []
      description: |
        One statistics view over the site's subscribers. `name` picks the
        view. When the date range is omitted it defaults to the last 7 days.

        `subscription-sources` returns the new SMS subscriptions collected
        in the range, one entry per source — where the subscribers came
        from: opt-in tools by type (popup, landing-page, embedded-form,
        keyword), and non-tool sources (import, custom-integration,
        public-api, shopify_checkout, …). Every subscription counts toward
        exactly one source; a source without SMS subscriptions in the range
        is absent. Entries are sorted descending by smsSubscriptions. For
        the per-tool split use /optin-tools/views/optin-tools-summary.
      parameters:
        - name: name
          in: path
          required: true
          description: The view to return
          schema:
            type: string
            enum:
              - subscription-sources
        - name: dateFrom
          in: query
          description: |
            First day of the range, inclusive (YYYY-MM-DD, UTC).
            Defaults to 7 days before `dateTo`. Must not be older than
            18 months — the API does not serve older data, and an older
            `dateFrom` returns 400.
          schema:
            type: string
            format: date
            example: '2026-08-18'
        - name: dateTo
          in: query
          description: |
            Last day of the range, inclusive — `dateTo=2026-08-24` includes
            the whole of 2026-08-24 (UTC). Defaults to today.
          schema:
            type: string
            format: date
            example: '2026-08-24'
      responses:
        '200':
          description: Ok
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    description: |
                      Always one resource of type subscribers-views;
                      attributes holds the requested view under its name.
                    $ref: '#/components/schemas/SubscribersViews'
              examples:
                subscription-sources:
                  summary: name=subscription-sources — one entry per source
                  value:
                    data:
                      type: subscribers-views
                      attributes:
                        subscription-sources:
                          - source: import
                            smsSubscriptions: 1200
                          - source: popup
                            smsSubscriptions: 419
                          - source: shopify_checkout
                            smsSubscriptions: 86
                          - source: public-api
                            smsSubscriptions: 12
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
