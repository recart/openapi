                            teaserConfirmRate: 0.0251
                            emailOptin: 0
                            emailOptinRate: 0
                            phoneNumberSubmitted: 310
                            phoneNumberSubmittedRate: 0.0152
                            smsOptin: 276
                            smsOptinRate: 0.0135
                            subscriptions: 268
                          655637c97825e6ae655fe1b5:
                            impression: 20600
                            teaserConfirm: 445
                            teaserConfirmRate: 0.0216
                            emailOptin: 0
                            emailOptinRate: 0
                            phoneNumberSubmitted: 271
                            phoneNumberSubmittedRate: 0.0132
                            smsOptin: 240
                            smsOptinRate: 0.0117
                            subscriptions: 233
                revenue-summary:
                  summary: name=revenue-summary
                  value:
                    data:
                      type: optin-tool-experiments-views
                      attributes:
                        revenue-summary:
                          655637c97825e6ae655fe1c9:
                            associatedRevenue: 2410.5
                            orders: 31
                            averageOrderValue: 77.76
                            revenuePerVisitor: 0.12
                            orderConversionRate: 0.0015
                          655637c97825e6ae655fe1b5:
                            associatedRevenue: 1988.2
                            orders: 24
                            averageOrderValue: 82.84
                            revenuePerVisitor: 0.1
                            orderConversionRate: 0.0012
                revenue-by-optin-segments:
                  summary: name=revenue-by-optin-segments — one array per variant
                  value:
                    data:
                      type: optin-tool-experiments-views
                      attributes:
                        revenue-by-optin-segments:
                          655637c97825e6ae655fe1c9:
                            - optinSegmentType: noOptin
                              optinSegmentCount: 20124
                              associatedRevenue: 430.1
                              orders: 6
                              averageOrderValue: 71.68
                              revenuePerVisitor: 0.02
                              orderConversionRate: 0.0003
                            - optinSegmentType: smsOptin
