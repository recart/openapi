    MetricEventStatistic:
      type: object
      description: Raw count and attributed order value of a single metric event
      required:
        - count
        - orderValueUSD
      properties:
        count:
          type: integer
          description: Number of times the event occurred
          example: 31
        orderValueUSD:
          type: number
          description: |
            Value of the orders attributed to the event, in USD, rounded to 2
            decimal places. 0 for every event other than impressionRevenue,
            emailClickRevenue and smsOptinRevenue.
          example: 2410.5
    OptinToolExperimentViews:
      type:
        - object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - optin-tool-experiments-views
        attributes:
          type: object
          description: |
            The requested section under its name — exactly one key for a single
            view, all four for name=all. Every section is an object keyed by the
            variant's opt-in tool ID, holding that variant's totals for the
            experiment's window.
          minProperties: 1
          properties:
            optin-summary:
              type: object
              description: Opt-in performance totals per variant
              additionalProperties:
                $ref: '#/components/schemas/OptinToolExperimentOptinSummaryData'
            revenue-summary:
              type: object
              description: Attributed revenue totals per variant
              additionalProperties:
                $ref: '#/components/schemas/RevenueMetrics'
            revenue-by-optin-segments:
              type: object
              description: |
                Attributed revenue split by opt-in segment per variant; one
                element per segment plus a total row
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/OptinToolRevenueByOptinSegmentsItem'
            metric-event-summary:
              type: object
              description: |
                Raw metric event counts per variant, available for significance
                math. Each variant holds a sparse map whose keys are MetricEvent
                values — only events that occurred within the experiment's
                window appear, and a missing key means 0.
              additionalProperties:
                type: object
                propertyNames:
                  $ref: '#/components/schemas/MetricEvent'
                additionalProperties:
                  $ref: '#/components/schemas/MetricEventStatistic'
