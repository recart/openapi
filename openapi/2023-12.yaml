  /messages:
    post:
      summary: Send message(s) to a subscriber
      tags:
        - Message
      operationId: postMessages
      security:
        - ApiKeyAuth: []
      description: |
        Trigger SMS/MMS messages. Maximum 10 messages can be sent in a single request. Requester must comply with TCPA regulations, and make sure the message is not sent in quiet hours.

        The site must have an active or trial SMS subscription, otherwise the request fails
        with `417`.

        Messages are queued in the order given rather than sent inline, so `202` confirms
        that they were accepted for delivery, not that they were delivered. The response
        returns one entry per message; poll `GET /messages/{id}` with the returned IDs to
        follow their delivery status.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostMessages'
      responses:
        '202':
          description: |
            The messages were accepted and queued for delivery, one entry per message, in
            the order they were given.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcceptedMessage'
        '400':
          description: |
            `ERR_BAD_REQUEST` — the payload failed validation, in which case `detail` lists
            the offending fields, or `phoneNumber` could not be parsed as a phone number.
            Validation covers the documented limits: at most 10 messages, `body` at most
            1024 characters, `type` must be `promotional`, and `attachment` must end in
            `.jpg`, `.jpeg`, `.png`, or `.gif`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '401':
          description: '`ERR_UNAUTHORIZED` — the `X-Recart-API-Key` header is missing.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '403':
          description: '`ERR_FORBIDDEN` — the API key is unknown or has been revoked.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '415':
          description: |
            `ERR_UNSUPPORTED_MEDIA_TYPE` — `Content-Type` must be `application/vnd.api+json`
            or `application/json`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '417':
          description: |
            `ERR_EXPECTATION_FAILED` — the site does not have an active or trial SMS
            subscription, so no messages can be sent until billing is resolved. No message
            in the request was queued.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '500':
          description: |
            The request passed validation but could not be processed.

            Messages are queued one by one, so a failure partway through leaves the earlier
            messages of the request already queued for delivery. No message IDs are returned
            in this case, so a blind retry of the whole request can duplicate the messages
            that already went through.

            Unlike the `4XX` responses, this status is not guaranteed to use the standard
            error envelope — an unstructured plain-text body is possible — so do not match
            on `errors[].code` here.
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
