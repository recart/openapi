  '/optin-tools/{id}/views/{name}':
    get:
      summary: Statistics view of an opt-in tool
      tags:
        - OptinTool
      operationId: getOptinToolView
      security:
        - ApiKeyAuth: []
      description: |
        One statistics view of a popup-type opt-in tool. `name` picks the view; `all`
        returns every section in one response. When the date range is
        omitted it defaults to the last 7 days.

        Statistics fields are never null: buckets without activity and empty
        ranges return 0 counts and 0 rates — zero and "no data" are
        deliberately not distinguished, matching the dashboard. The only
        fields that can be absent are the channel-gated email/SMS ones,
        which are omitted when the tool does not collect that channel.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the opt-in tool
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The view to return
          schema:
            type: string
            enum:
              - optin-summary
              - optin-history
              - revenue-summary
              - revenue-history
              - revenue-by-optin-segments
              - revenue-by-countries
              - subscriptions-history
              - all
        - name: dateFrom
          in: query
          description: |
            First day of the range, inclusive (YYYY-MM-DD, UTC).
            Defaults to 7 days before `dateTo`.
          schema:
            type: string
            format: date
            example: '2026-08-04'
        - name: dateTo
          in: query
          description: |
            Last day of the range, inclusive — `dateTo=2026-08-10` includes
            the whole of 2026-08-10 (UTC). Defaults to today.
          schema:
            type: string
            format: date
            example: '2026-08-10'
        - name: targetResolution
          in: query
          description: Bucket size of the time series — history views and `all` only. Buckets are UTC; weeks start on Monday.
          schema:
            type: string
            enum:
              - day
              - week
              - month
              - year
            default: day
      responses:
        '200':
          description: Ok
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    description: |
                      Always one resource of type optin-tool-views. attributes
                      holds the requested view's data under its name — one key
                      for a single view, all seven for name=all.
                    $ref: '#/components/schemas/OptinToolViews'
              examples:
                optin-summary:
                  summary: name=optin-summary
                  value:
                    data:
                      type: optin-tool-views
                      attributes:
                        optin-summary:
                          impression: 41200
                          teaserConfirm: 890
                          teaserConfirmRate: 0.0216
                          teaserDecline: 2140
                          emailOptin: 610
                          emailOptinRate: 0.0148
                          phoneNumberSubmitted: 530
                          phoneNumberSubmittedRate: 0.0129
                          smsOptin: 480
                          smsOptinRate: 0.0117
                optin-history:
                  summary: name=optin-history — one bucket per targetResolution unit
                  value:
                    data:
                      type: optin-tool-views
                      attributes:
                        optin-history:
                          - timestamp: '2026-07-27'
                            impression: 5480
                            emailOptin: 84
                            emailOptinRate: 0.0153
                            smsOptin: 66
                            smsOptinRate: 0.012
                          - timestamp: '2026-07-28'
                            impression: 0
                            emailOptin: 0
                            emailOptinRate: 0
                            smsOptin: 0
                            smsOptinRate: 0
                revenue-summary:
                  summary: name=revenue-summary
                  value:
                    data:
                      type: optin-tool-views
                      attributes:
                        revenue-summary:
                          associatedRevenue: 12403.5
                          orders: 96
                          averageOrderValue: 129.2
                          revenuePerVisitor: 0.3
                          orderConversionRate: 0.0023
                revenue-history:
                  summary: name=revenue-history — one bucket per targetResolution unit
                  value:
                    data:
                      type: optin-tool-views
                      attributes:
                        revenue-history:
                          - timestamp: '2026-07-27'
                            associatedRevenue: 1710
                            orders: 13
                            averageOrderValue: 131.54
                            revenuePerVisitor: 0.31
                            orderConversionRate: 0.0024
                revenue-by-optin-segments:
                  summary: name=revenue-by-optin-segments
                  value:
                    data:
                      type: optin-tool-views
                      attributes:
                        revenue-by-optin-segments:
                          - optinSegmentType: smsOptin
                            optinSegmentCount: 480
                            associatedRevenue: 5100
                            orders: 41
                            averageOrderValue: 124.39
                            revenuePerVisitor: 10.63
                            orderConversionRate: 0.0854
                          - optinSegmentType: total
                            optinSegmentCount: 41200
                            associatedRevenue: 12403.5
                            orders: 96
                            averageOrderValue: 129.2
                            revenuePerVisitor: 0.3
                            orderConversionRate: 0.0023
                revenue-by-countries:
                  summary: name=revenue-by-countries
                  value:
                    data:
