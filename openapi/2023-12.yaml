        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  /messages:
    post:
      summary: Send message(s) to a subscriber
      tags:
        - Message
      operationId: postMessages
      security:
        - ApiKeyAuth: []
      description: |
        Trigger SMS/MMS messages. Maximum 10 messages can be sent in a single request. Requester must comply with TCPA regulations, and make sure the message is not sent in quiet hours.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostMessages'
      responses:
        '202':
          description: Accepted
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  '/messages/{id}':
    get:
      summary: Returns the message's status by its ID
      tags:
        - Message
      operationId: getMessage
      security:
        - ApiKeyAuth: []
      description: Returns the status of the selected message.
      parameters:
        - in: path
          name: id
          description: ID of the message
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OutgoingMessage'
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  '/lists/{id}/phone-numbers':
    post:
      description: Add or remove phone numbers to a list
      summary: Add or remove phone numbers to a list
      operationId: modifyListMembers
      security:
        - ApiKeyAuth: []
      tags:
        - List
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the list
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ModifyListMembersRequest'
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModifyListMembersResponse'
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Recart-API-Key
      description: It can be obtained in Recart account after contacting Support
  responses:
    HttpError:
      description: HTTP Error response
      content:
        application/vnd.api+json:
          schema:
            type: object
            required:
              - errors
            properties:
              errors:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - code
                    - title
                    - detail
                  properties:
                    id:
                      type: string
                      example: 17035478-01a9-4aeb-a13c-88ab51e6fee3
                    code:
                      type: string
                      example: ERR_BAD_REQUEST
                    title:
                      type: string
                      example: Bad request
                    detail:
                      type: string
                      example: ''
  schemas:
    Flow:
      type:
        - object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - flows
        attributes:
          type: object
          required:
            - id
            - name
            - tags
            - status
          properties:
            id:
              type: string
              description: ID of flow
              example: 655637c97825e6ae655fe1b5
            name:
              type: string
              description: Name of flow
              example: Welcome flow
            tags:
              type: array
              items:
                type: string
              description: Flow tags
              example:
                - automated
                - welcome
            status:
              type: string
              description: Status of flow
              enum:
                - draft
                - active
                - inactive
                - cancelled
    OptinTool:
      type:
        - object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - optin-tools
        attributes:
          type: object
          required:
            - id
            - name
            - type
            - status
            - devices
            - channels
          properties:
            id:
              type: string
              description: ID of the opt-in tool
              example: 655637c97825e6ae655fe1b5
            name:
              type: string
              description: Name of the opt-in tool
              example: Mobile - Preferences - Custom Images
            type:
              type: string
              description: Type of the opt-in tool
              enum:
                - popup
                - landing-page
                - embedded-form
                - keyword
            status:
              type: string
              description: Status of the opt-in tool
              enum:
                - active
                - draft
                - inactive
            devices:
              type: array
              description: Devices the tool targets
              items:
                type: string
                enum:
                  - mobile
                  - desktop
            channels:
              type: array
              description: Channels the tool collects
              items:
                type: string
                enum:
                  - email
                  - sms
            statusSchedule:
              type: object
              description: Upcoming scheduled status transitions. UTC Date and time in ISO 8601 format
              properties:
                activateAt:
                  type: string
                  format: date-time
                  example: '2026-08-03T14:00:00.000+02:00'
                inactivateAt:
                  type: string
                  format: date-time
                  example: '2026-08-10T14:00:00.000+02:00'
            optinMethod:
              type: object
              description: What handles a new opt-in
              required:
                - type
              properties:
                type:
                  type: string
                  description: Type of the message handler
                  enum:
                    - flow
                    - integration
                flowId:
                  type: string
                  description: ID of the flow the tool feeds (type flow only)
                  example: 655637c97825e6ae655fe1c2
            experimentIds:
              type: array
              description: IDs of A/B experiments the tool participates in
              items:
                type: string
              example:
                - 655637c97825e6ae655fe1d9
            steps:
              type: array
              description: Steps of the tool (popup only)
              items:
                type: string
                enum:
                  - teaser
                  - email
                  - sms
                  - smsWithEmail
                  - oneTimePassword
                  - oneClickVerification
                  - oneClickOptin
                  - success
            messagingType:
              type: string
              description: Messaging type of the tool (popup only)
              enum:
                - two-way
                - one-way
            settings:
              type: object
              description: |
                Full tool settings (type-dependent). Returned only by getOptinTool;
                the collection endpoint omits it.
    RevenueMetrics:
      type: object
      description: |
        Revenue attributed to the opt-in tool: orders placed within 7 days
        of an interaction with the tool in the same session. Amounts are in
        USD, rounded to 2 decimal places. Fields are never null: a range
        without attributed orders returns 0 amounts, and rates are 0 when
        the denominator is 0.
      required:
        - associatedRevenue
        - orders
        - averageOrderValue
        - revenuePerVisitor
        - orderConversionRate
      properties:
        associatedRevenue:
          type: number
          description: Total value of the orders attributed to the opt-in tool, in USD
          example: 12403.5
        orders:
          type: integer
          description: Number of orders attributed to the opt-in tool
          example: 96
        averageOrderValue:
          type: number
          description: associatedRevenue / orders, in USD
          example: 129.2
        revenuePerVisitor:
          type: number
          description: associatedRevenue / impressions, in USD
          example: 0.3
        orderConversionRate:
          type: number
          description: orders / impressions
          example: 0.0023
    OptinToolOptinSummaryData:
      type: object
      description: |
        Opt-in performance totals for the range. Counts are unique sessions.
        Email/SMS fields appear only when the tool collects that channel.
        Fields are never null: a range without data returns 0 counts and
        0 rates.
      required:
        - impression
        - teaserConfirm
        - teaserConfirmRate
        - teaserDecline
      properties:
        impression:
          type: integer
          description: Unique sessions in which the popup was displayed
          example: 41200
        teaserConfirm:
          type: integer
          description: Unique sessions that clicked the teaser and opened the popup
          example: 890
        teaserConfirmRate:
          type: number
          description: teaserConfirm / impression
          example: 0.0216
        teaserDecline:
          type: integer
          description: Unique sessions that dismissed the teaser
          example: 2140
        emailOptin:
          type: integer
          description: Unique sessions that submitted an email address on the popup
          example: 610
        emailOptinRate:
          type: number
          description: emailOptin / impression
          example: 0.0148
        phoneNumberSubmitted:
          type: integer
          description: Unique sessions that submitted a phone number on the popup
          example: 530
        phoneNumberSubmittedRate:
          type: number
          description: phoneNumberSubmitted / impression
          example: 0.0129
        smsOptin:
          type: integer
          description: Unique sessions that completed the SMS opt-in
          example: 480
        smsOptinRate:
          type: number
          description: smsOptin / impression
          example: 0.0117
    OptinToolOptinHistoryBucket:
      type: object
      required:
        - timestamp
        - impression
      properties:
        timestamp:
          type: string
          format: date
          description: Start of the bucket, in UTC (weeks start on Monday)
          example: '2026-07-27'
        impression:
          type: integer
          description: Unique sessions in which the popup was displayed within the bucket
        emailOptin:
          type: integer
          description: Unique sessions that submitted an email address within the bucket
        emailOptinRate:
          type: number
          description: emailOptin / impression within the bucket
        smsOptin:
          type: integer
          description: Unique sessions that completed the SMS opt-in within the bucket
        smsOptinRate:
          type: number
          description: smsOptin / impression within the bucket
    OptinToolRevenueHistoryBucket:
      allOf:
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date
              description: Start of the bucket, in UTC (weeks start on Monday)
              example: '2026-07-27'
        - $ref: '#/components/schemas/RevenueMetrics'
    OptinToolRevenueByOptinSegmentsItem:
      allOf:
        - type: object
          required:
            - optinSegmentType
            - optinSegmentCount
          properties:
            optinSegmentType:
              type: string
              description: |
                The deepest opt-in stage the sessions in this row reached
                (noOptin / emailOptin / smsOptin / emailAndSMSOptin); the
                total row sums the whole funnel
              enum:
                - noOptin
                - emailOptin
                - smsOptin
                - emailAndSMSOptin
                - total
            optinSegmentCount:
              type: integer
              description: Unique sessions whose deepest opt-in stage is this segment
        - $ref: '#/components/schemas/RevenueMetrics'
    OptinToolRevenueByCountriesItem:
      allOf:
        - type: object
          required:
            - countryCode
            - impressionCount
          properties:
            countryCode:
              type: string
              description: |
                ISO 3166-1 alpha-2 country code of the visitors;
              example: US
            impressionCount:
              type: integer
              description: Unique sessions in which the popup was displayed in this country
        - $ref: '#/components/schemas/RevenueMetrics'
    OptinToolSubscriptionsHistoryBucket:
      type: object
      required:
        - timestamp
        - subscriptions
      properties:
        timestamp:
          type: string
          format: date
          description: Start of the bucket, in UTC (weeks start on Monday)
          example: '2026-07-27'
        subscriptions:
          type: integer
          description: New SMS subscribers the opt-in tool collected within the bucket
    OptinToolViews:
      type:
        - object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - optin-tool-views
        attributes:
          type: object
          description: |
            The requested view's data under its name — exactly one key for a
            single view, all seven for name=all. History and breakdown values
            are arrays (one element per bucket / country / segment).
          minProperties: 1
          properties:
            optin-summary:
              description: Opt-in performance totals for the range
              $ref: '#/components/schemas/OptinToolOptinSummaryData'
            optin-history:
              type: array
              description: Opt-in performance per bucket; one bucket per targetResolution unit, gaps zero-filled
              items:
                $ref: '#/components/schemas/OptinToolOptinHistoryBucket'
            revenue-summary:
              description: Revenue attributed to the tool, totals for the range
              $ref: '#/components/schemas/RevenueMetrics'
            revenue-history:
              type: array
              description: Attributed revenue per bucket; one bucket per targetResolution unit, gaps zero-filled
              items:
                $ref: '#/components/schemas/OptinToolRevenueHistoryBucket'
            revenue-by-optin-segments:
              type: array
              description: Attributed revenue split by opt-in segment; one element per segment plus a total row
              items:
                $ref: '#/components/schemas/OptinToolRevenueByOptinSegmentsItem'
            revenue-by-countries:
              type: array
              description: Impressions and attributed revenue per country, sorted desc by associatedRevenue; UNKNOWN_COUNTRY included
              items:
                $ref: '#/components/schemas/OptinToolRevenueByCountriesItem'
            subscriptions-history:
              type: array
              description: New SMS subscribers collected by the tool per bucket; one bucket per targetResolution unit, gaps zero-filled
              items:
                $ref: '#/components/schemas/OptinToolSubscriptionsHistoryBucket'
    OptinToolExperiment:
      type:
        - object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - optin-tool-experiments
        attributes:
          type: object
          required:
            - id
            - name
            - status
            - dateFrom
            - dateTo
            - optinToolIds
            - createdAt
          properties:
            id:
              type: string
              description: ID of the experiment
              example: 655637c97825e6ae655fe1d9
            name:
              type: string
              description: Name of the experiment
              example: Teaser vs no teaser
            status:
              type: string
              description: |
                Status of the experiment. A scheduled experiment has no
                statistics yet, so its views return 400.
              enum:
                - scheduled
                - running
                - ended
            dateFrom:
              type: string
              format: date-time
              description: Start of the experiment window. UTC date and time in ISO 8601 format
              example: '2026-07-27T00:00:00.000Z'
            dateTo:
              type: string
              format: date-time
              description: |
                End of the experiment window, exclusive. UTC date and time in
                ISO 8601 format. For a running experiment this is the planned
                end; statistics stop at the current time instead.
              example: '2026-08-10T00:00:00.000Z'
            optinToolIds:
              type: array
              description: |
                IDs of the opt-in tools taking part in the experiment — its
                variants. Statistics views return one entry per ID.
              items:
                type: string
              example:
                - 655637c97825e6ae655fe1c9
                - 655637c97825e6ae655fe1b5
            winnerOptinToolId:
              type: string
              description: |
                ID of the variant Recart picked as the winner, present once the
                experiment has ended. Picked on opt-in rate alone — this is not
                a statistical significance test.
              example: 655637c97825e6ae655fe1c9
            winnerOptinRate:
              type: number
              description: Opt-in rate of the winning variant
              example: 0.0135
            createdAt:
              type: string
              format: date-time
              description: Creation time of the experiment. UTC date and time in ISO 8601 format
              example: '2026-07-20T09:14:33.000Z'
            updatedAt:
              type: string
              format: date-time
              description: Last modification time of the experiment. UTC date and time in ISO 8601 format
              example: '2026-08-10T00:00:01.000Z'
    OptinToolExperimentOptinSummaryData:
      type: object
      description: |
        Opt-in performance totals of one variant for the experiment's window.
        Counts are unique sessions. Email/SMS fields appear only when the tool
        collects that channel. Fields are never null: a variant without data
        returns 0 counts and 0 rates.
      required:
        - impression
        - teaserConfirm
        - teaserConfirmRate
        - subscriptions
      properties:
        impression:
          type: integer
          description: Unique sessions in which the popup was displayed
          example: 20400
        teaserConfirm:
          type: integer
          description: Unique sessions that clicked the teaser and opened the popup
          example: 512
        teaserConfirmRate:
          type: number
          description: teaserConfirm / impression
          example: 0.0251
        emailOptin:
          type: integer
          description: Unique sessions that submitted an email address on the popup
          example: 0
        emailOptinRate:
          type: number
          description: emailOptin / impression
          example: 0
        phoneNumberSubmitted:
          type: integer
          description: Unique sessions that submitted a phone number on the popup
          example: 310
        phoneNumberSubmittedRate:
          type: number
          description: phoneNumberSubmitted / impression
          example: 0.0152
        smsOptin:
          type: integer
          description: Unique sessions that completed the SMS opt-in
          example: 276
        smsOptinRate:
          type: number
          description: smsOptin / impression
          example: 0.0135
        subscriptions:
          type: integer
          description: New SMS subscribers the variant collected
          example: 268
    MetricEvent:
      type: string
      description: |
        Raw popup metric event identifier. Revenue is carried only by
        impressionRevenue, emailClickRevenue and smsOptinRevenue; orderValueUSD
        is 0 for every other event.
      enum:
        - teaserConfirmation
        - teaserDecline
        - smsClick
