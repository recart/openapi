  /subscribers:
    patch:
      summary: Update subscriber's custom attributes
      tags:
        - Subscriber
      operationId: patchSubscriber
      security:
        - ApiKeyAuth: []
      description: |
        Update the custom attributes of an SMS subscriber identified by phone number. Only the custom attributes included in the request are modified; attributes that are not provided remain unchanged.
      parameters:
        - name: phoneNumber
          in: query
          required: true
          description: Phone number of the subscriber
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PatchSubscriber'
      responses:
        '204':
          description: No content
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  /subscriptions:
    post:
      summary: Initiate SMS subscription
      tags:
        - Subscription
      operationId: postSubscription
      security:
        - ApiKeyAuth: []
      description: |
        Trigger an SMS subscription flow in Recart. It sends the associated welcome flow to the recipient. Flow must be active to comply TCPA regulations.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostSubscription'
      responses:
        '202':
          description: Accepted
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
    delete:
      summary: Unsubscribe SMS subscriber
      tags:
        - Subscription
      operationId: deleteSubscription
      security:
        - ApiKeyAuth: []
      description: |
        Unsubscribe an SMS subscriber if it's not unsubscribed yet.
      parameters:
        - name: phoneNumber
          in: query
          required: true
          description: Phone number of the subscriber
          schema:
            type: string
      responses:
        '204':
          description: No content
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  /event-sources:
    post:
      summary: Create new event source
      tags:
        - Event
      operationId: createEventSource
      security:
        - ApiKeyAuth: []
      description: |
        Create a new source to start sending events
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostEventSource'
      responses:
        '201':
          description: Created
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  /events:
    post:
      summary: Post an event
      tags:
        - Event
      operationId: postEvent
      security:
        - ApiKeyAuth: []
      description: |
        Post an event which can be used to trigger flows in Recart.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostEvent'
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
  /webhooks:
    get:
      summary: Retrieve list of webhooks
      tags:
        - Webhook
      operationId: listWebhooks
      security:
        - ApiKeyAuth: []
      description: Retrieve list of webhooks
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
    post:
      summary: Create a new webhook
      tags:
        - Webhook
      operationId: createWebhook
      security:
        - ApiKeyAuth: []
      description: Create a new webhook
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Webhook'
      responses:
        '201':
          description: Created
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
      callbacks:
        Incoming message:
          '{$request.body#/data/attributes/address}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/IncomingMessage'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
        Outgoing message:
          '{$request.body#/data/attributes/address}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/OutgoingMessage'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
        Subscribers unsubscribe:
          '{$request.body#/data/attributes/address}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/SubscribersUnsubscribe'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
        Subscribers subscribe:
          '{$request.body#/data/attributes/address}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/SubscribersSubscribe'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
  '/webhooks/{id}':
    get:
      summary: Recieve a single webhook
      tags:
