            receivedAt:
              type: string
              description: UTC Date and time in ISO 8601 format
              example: '2021-08-10T14:00:00.000+02:00'
    AcceptedMessage:
      type: object
      description: A message accepted for delivery by `POST /messages`.
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - messages
        attributes:
          type: object
          required:
            - id
            - message
          properties:
            id:
              type: string
              description: ID of the queued message. Use it with `GET /messages/{id}` to follow the delivery status.
              example: 65ba227ffa0ad3e1bef89449
            message:
              type: string
              description: Content of the message, echoed back from the request
              example: 'Hi, welcome to our store.'
    OutgoingMessage:
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          enum:
            - messages
        attributes:
          type: object
          properties:
            id:
              type: string
              description: Id
              example: 65ba227ffa0ad3e1bef89449
            status:
              type: string
              description: 'Status of the message. It can be processing, sent or error'
              example: sent
            body:
              type: string
              description: Content of the message
              example: Hey there! Your order is on the way.
            sentAt:
              type: string
              description: UTC Date and time in ISO 8601 format
              example: '2021-08-10T14:00:00.000+02:00'
            from:
              type: string
              description: Phone number of the sender in E.164 format
              example: '+36301234567'
            to:
              type: string
              description: Phone number of the recipient in E.164 format
              example: '+36301234567'
