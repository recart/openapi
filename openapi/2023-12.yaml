  '/optin-tool-experiments/{id}/views/{name}':
    get:
      summary: Statistics view of an A/B test experiment
      tags:
        - OptinTool
      operationId: getOptinToolExperimentView
      security:
        - ApiKeyAuth: []
      description: |
        One statistics view of an A/B test experiment — the same numbers as the
        dashboard's experiment results. `name` picks the section; `all` returns
        every section in one response. A single request always returns every
        variant of the experiment: each section is an object keyed by the
        variant's opt-in tool ID, so the caller never passes `optinToolIds` —
        the participants are read from the experiment itself.

        There are no date parameters and no `targetResolution` — every section
        is a total for the experiment's own window, which is derived from its
        status: an `ended` experiment uses its full window, a `running` one
        spans its start until now, and a `scheduled` one has no statistics yet
        and returns 400.

        Statistics fields behave as in the opt-in tool views: counts and rates
        are never null, so a variant without activity returns 0 rather than
        being omitted, and rates are 0 when the denominator is 0. The
        exceptions are the channel-gated email/SMS fields, absent when the
        tool does not collect that channel, and `metric-event-summary`,
        whose per-variant map is sparse — only events that occurred appear, and
        a missing key means 0.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the experiment
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The view to return
          schema:
            type: string
            enum:
              - optin-summary
              - revenue-summary
              - revenue-by-optin-segments
              - metric-event-summary
              - all
      responses:
        '200':
          description: Ok
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    description: |
                      Always one resource of type optin-tool-experiments-views.
                      attributes holds the requested section under its name,
                      keyed by variant optinToolId — one section key for a
                      single view, all four for name=all.
                    $ref: '#/components/schemas/OptinToolExperimentViews'
              examples:
                optin-summary:
                  summary: name=optin-summary — both variants keyed by opt-in tool ID
                  value:
                    data:
                      type: optin-tool-experiments-views
                      attributes:
                        optin-summary:
