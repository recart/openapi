  '/optin-tools/views/{name}':
    get:
      summary: Statistics view of all opt-in tools of the site
      tags:
        - OptinTool
      operationId: getOptinToolListView
      security:
        - ApiKeyAuth: []
      description: |
        The account-level opt-in tool statistics view — every opt-in tool of
        the site in a single response, the collection counterpart of
        `/optin-tools/{id}/views/{name}`. `name` picks the view. When the
        date range is omitted it defaults to the last 7 days.

        `optin-tools-summary` returns one entry per opt-in tool that
        recorded any metric event or collected any SMS subscription in the
        range: the tool's `optinToolName` and `optinToolType`, then its raw
        metric-event unique-session counts merged with its new SMS
        subscription count. Event keys are sparse — a missing key means 0;
        `smsSubscriptions` is always present, 0 when none. Because every
        entry names and types its own tool, a per-type total can be computed
        from this response alone, without a separate `/optin-tools` call.
        Values are counts, not amounts: this view carries no USD figures; for
        attributed revenue use the per-tool revenue views. Subscriptions from
        non-tool sources (imports, customer chat, …) are not part of this
        view.
      parameters:
        - name: name
          in: path
          required: true
          description: The view to return
          schema:
            type: string
            enum:
              - optin-tools-summary
        - name: dateFrom
          in: query
          description: |
            First day of the range, inclusive (YYYY-MM-DD, UTC).
            Defaults to 7 days before `dateTo`. Must not be older than
            18 months — the API does not serve older data, and an older
            `dateFrom` returns 400.
          schema:
            type: string
            format: date
            example: '2026-08-18'
        - name: dateTo
          in: query
          description: |
            Last day of the range, inclusive — `dateTo=2026-08-24` includes
            the whole of 2026-08-24 (UTC). Defaults to today.
          schema:
            type: string
            format: date
            example: '2026-08-24'
      responses:
        '200':
          description: Ok
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    description: |
                      Always one resource of type optin-tool-list-views.
                      attributes holds the requested view under its name,
                      keyed by source (opt-in tool ID or slug) inside.
                    $ref: '#/components/schemas/OptinToolListViews'
              examples:
                optin-tools-summary:
                  summary: name=optin-tools-summary — sparse event counts; a missing event means 0
                  value:
                    data:
                      type: optin-tool-list-views
                      attributes:
                        optin-tools-summary:
                          - optinToolId: 655637c97825e6ae655fe1c9
                            optinToolName: Summer sale — Main
                            optinToolType: popup
                            impression: 20400
                            teaserConfirmation: 512
                            closePopup: 3100
                            emailClick: 512
                            smsOptin: 276
                            smsSubscriptions: 150
                          - optinToolId: 655637c97825e6ae655fe1b5
                            optinToolName: Summer sale — Preferences
                            optinToolType: popup
                            impression: 18100
                            teaserConfirmation: 445
                            engagement: 5210
                            smsOptin: 190
                            smsSubscriptions: 120
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
