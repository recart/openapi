  /events:
    post:
      summary: Post an event
      tags:
        - Event
      operationId: postEvent
      security:
        - ApiKeyAuth: []
      description: |
        Post an event which can be used to trigger flows in Recart.

        Three preconditions must hold, each of which fails with its own status code:

        - the event source (`source.category` and `source.name`) is registered for the site
          via `POST /event-sources`,
        - `phoneNumber` belongs to an existing subscriber — this endpoint never creates one,
        - that subscriber has an active SMS subscription.

        Registered event sources are cached for up to 15 seconds, per service instance, so
        allow at least that long between creating an event source and posting the first event
        against it. Because the cache is per instance, the first events can still fail with
        `417` after another instance has already picked the new source up.

        Whether a flow is actually listening for the event is *not* checked. If no active
        Integration flow uses the event source as its trigger, the event is still accepted
        and simply results in no message — so confirm the flow is active in the Recart
        dashboard when events succeed but nothing is sent.

        The event is queued for processing, so `200` confirms that it was accepted, not that
        a message was sent. The `200` response body is the plain-text string `OK`, not a
        JSON:API document — do not parse it as JSON.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PostEvent'
      responses:
        '200':
          description: |
            The event was accepted and queued for processing. The body is the plain-text
            string `OK`.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: |
            `ERR_BAD_REQUEST` — the payload failed validation, in which case `detail` lists
            the offending fields, or `phoneNumber` could not be parsed as a phone number.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '401':
          description: '`ERR_UNAUTHORIZED` — the `X-Recart-API-Key` header is missing.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '403':
          description: '`ERR_FORBIDDEN` — the API key is unknown or has been revoked.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '404':
          description: |
            `ERR_NOT_FOUND` — no subscriber exists for `phoneNumber`. Subscribe the phone
            number first; posting an event does not create a subscriber.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '415':
          description: |
            `ERR_UNSUPPORTED_MEDIA_TYPE` — `Content-Type` must be `application/vnd.api+json`
            or `application/json`.

            A `Content-Type` the API cannot parse at all is rejected earlier, before this
            error format applies, and returns an unstructured plain-text body. A malformed
            JSON body is rejected the same way, with `400`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '417':
          description: |
            `ERR_EXPECTATION_FAILED` — a precondition on the account is not met. Either no
            event source is registered for the site with this `source.category` and
            `source.name` pair, or the subscriber exists but does not have an active SMS
            subscription. The two cases are distinguished by `detail`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        '500':
          description: |
            `ERR_INTERNAL_SERVER_ERROR` — the event passed validation but the request could
            not be processed, either because the subscriber could not be looked up or
            because the event could not be queued. The event was not processed, so it is
            safe to retry.

            Failures reaching an upstream service can also surface as other `5XX` statuses
            with an unstructured body, so treat the whole `5XX` range as retryable rather
            than matching on `500` alone.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HttpErrorBody'
        4XX:
          $ref: '#/components/responses/HttpError'
        5XX:
          $ref: '#/components/responses/HttpError'
